spring:
  application:
    name: rotacerta-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rotacerta}
    username: ${SPRING_DATASOURCE_USERNAME:rotacerta}
    password: ${SPRING_DATASOURCE_PASSWORD:rotacerta}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upload-dir: ${DRIVER_UPLOAD_DIR:uploads}
  security:
    jwt-secret: ${ROTACERTA_JWT_SECRET:rotacerta-local-development-secret-key-change-me-2026}
    access-token-minutes: ${ROTACERTA_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${ROTACERTA_REFRESH_TOKEN_DAYS:7}
    frontend-origin: ${ROTACERTA_FRONTEND_ORIGIN:http://localhost:5173}
    seed-demo-users: ${ROTACERTA_SEED_DEMO_USERS:true}
